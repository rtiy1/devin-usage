<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Devin 用量</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="14" width="4" height="7" rx="1" fill="#1f6feb"/><rect x="10" y="9" width="4" height="12" rx="1" fill="#388bfd"/><rect x="17" y="4" width="4" height="17" rx="1" fill="#58a6ff"/></svg>
      <h1>Devin 用量</h1>
    </div>
    <nav class="tabs">
      <button class="tab on" data-tab="dash">仪表盘</button>
      <button class="tab" data-tab="accts">账号管理</button>
    </nav>
    <div class="head-right">
      <span class="live-dot" id="liveDot"></span>
      <span id="clock" class="dim"></span>
      <span id="planBadge" class="badge"></span>
    </div>
  </header>

  <div class="wrap">
    <div id="err" class="err" hidden></div>

    <!-- ============ 仪表盘 ============ -->
    <section id="page-dash">
      <div class="greet" id="greet"></div>
      <section id="quota" class="panel pad" hidden></section>
      <section id="online" class="grid stats" hidden></section>
      <section id="totals" class="grid stats"></section>

      <div class="cols">
        <div>
          <h2>最近 14 天 <span class="dim tag-local">本机</span></h2>
          <section id="chart" class="panel"></section>
        </div>
        <div>
          <h2 id="onlineModelsTitle" hidden>模型 · 云端 30 天</h2>
          <section id="onlineModels" class="panel" hidden></section>
          <h2>模型 · 今天 <span class="dim tag-local">本机</span></h2>
          <section id="models" class="panel"></section>
        </div>
      </div>

      <div class="cols">
        <div>
          <h2 id="onlineToolsTitle" hidden>工具调用 · 云端 30 天</h2>
          <section id="onlineTools" class="panel" hidden></section>
        </div>
        <div>
          <h2>会话 <span class="dim tag-local">本机</span></h2>
          <section id="sessions" class="panel"></section>
        </div>
      </div>

      <footer id="foot"></footer>
    </section>

    <!-- ============ 账号管理 ============ -->
    <section id="page-accts" hidden>
      <div class="toolbar">
        <input id="acctSearch" class="search" placeholder="搜索账号…" />
        <div class="filters">
          <button class="flt on" data-f="all">全部</button>
          <button class="flt" data-f="low">低配额</button>
        </div>
        <div class="spacer"></div>
        <button id="addAcct" class="btn primary">＋ 添加账号</button>
        <button id="refreshAll" class="btn">⟳ 刷新所有</button>
      </div>

      <div id="loginPane" class="panel login" hidden>
        <div class="login-title">浏览器已打开登录页</div>
        <p class="dim"><span id="loginHint"></span> 如果浏览器没有自动打开，<a id="loginUrl" href="#" target="_blank">点这里</a>。</p>
        <div class="row">
          <input id="codeInput" placeholder="粘贴代码" autocomplete="off" />
          <button id="codeSubmit" class="btn primary">完成登录</button>
          <button id="loginCancel" class="btn ghost">取消</button>
        </div>
        <div id="loginErr" class="err" hidden></div>
      </div>

      <div id="acctGrid" class="acct-grid"></div>
      <div id="acctEmpty" class="dim empty" hidden>暂无账号 — 点右上角「添加账号」登录</div>
    </section>
  </div>

  <script src="main.js"></script>
</body>
</html>
