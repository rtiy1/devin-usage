[package]
name = "devin-usage"
version = "0.1.0"
description = "Devin CLI usage monitor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
chrono = "0.4"
aes-gcm = "0.10"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
getrandom = "0.2"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
